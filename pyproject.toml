[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prayer-timing-api"
version = "0.1.0"
description = "Production-oriented Islamic prayer and Azan timing API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "adhanpy>=1.0,<2.0",
    "tzdata>=2026.4",
    "uvicorn>=0.30,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["postman*"]

[dependency-groups]
dev = [
    "workers-py>=1.17.3",
    "workers-runtime-sdk>=1.9.0",
]
